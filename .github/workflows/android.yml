name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Install Capacitor CLI & Core
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Project
        run: |
          # If gradlew does not exist in android/, clean incomplete android folder and re-initialize capacitor android
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew missing! Re-generating fresh Capacitor android project..."
            rm -rf android
            npx cap add android
          fi

          # Ensure gradlew exists, or generate wrapper via gradle CLI
          if [ ! -f "android/gradlew" ]; then
            echo "Generating Gradle Wrapper..."
            cd android
            gradle wrapper
            cd ..
          fi

          # Copy custom AndroidManifest.xml and all resources / java files
          echo "Syncing custom AndroidManifest.xml and AAPT resources..."
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/java/com/remix/gesture/controller

          if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          if [ -d "android_custom/res" ]; then
            cp -r android_custom/res/* android/app/src/main/res/
          fi

          # Copy Kotlin classes
          if [ -d "android/app/src/main/java/com/remix/gesture/controller" ]; then
            cp -r src/android_services/* android/app/src/main/java/com/remix/gesture/controller/ 2>/dev/null || true
          fi

          # Remove deprecated package attribute from manifest for AGP 7+ compatibility
          sed -i 's/package="[^"]*"//g' android/app/src/main/AndroidManifest.xml || true

          npx cap sync android

      - name: Resolve Kotlin Stdlib Duplicate Classes
        run: |
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
                  }
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Gesture-Controller-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
