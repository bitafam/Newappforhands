name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Install Capacitor CLI & Core
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Project
        run: |
          # Backup custom AndroidManifest.xml if present
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Backing up custom AndroidManifest.xml..."
            cp android/app/src/main/AndroidManifest.xml /tmp/custom_manifest.xml
          elif [ -f "AndroidManifest.xml" ]; then
            echo "Backing up root AndroidManifest.xml..."
            cp AndroidManifest.xml /tmp/custom_manifest.xml
          fi

          # If gradlew does not exist in android/, clean incomplete android folder and re-initialize capacitor android
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew missing! Re-generating fresh Capacitor android project..."
            rm -rf android
            npx cap add android
          fi

          # Ensure gradlew exists, or generate wrapper via gradle CLI
          if [ ! -f "android/gradlew" ]; then
            echo "Generating Gradle Wrapper..."
            cd android
            gradle wrapper
            cd ..
          fi

          # Restore custom AndroidManifest.xml into generated android project
          if [ -f "/tmp/custom_manifest.xml" ]; then
            echo "Restoring custom AndroidManifest.xml with all APK permissions..."
            mkdir -p android/app/src/main
            cp /tmp/custom_manifest.xml android/app/src/main/AndroidManifest.xml
            # Remove deprecated package attribute from manifest for AGP 7+ compatibility
            sed -i 's/package="[^"]*"//g' android/app/src/main/AndroidManifest.xml
          fi

          npx cap sync android

      - name: Resolve Kotlin Stdlib Duplicate Classes
        run: |
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
                  }
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Gesture-Controller-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
